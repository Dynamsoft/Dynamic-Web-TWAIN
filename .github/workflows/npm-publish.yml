name: Publish NPM Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      # ============================================================
      # 1. Checkout the exact release tag
      # ============================================================
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # ============================================================
      # 3. Upgrade npm to a Trusted Publishing compatible version
      # ============================================================
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          hash -r

      # ============================================================
      # 4. Remove _authToken generated by setup-node
      #    so npm can use GitHub OIDC Trusted Publishing
      # ============================================================
      - name: Remove npm auth token configuration
        shell: bash
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          echo "npm config file:"
          echo "$npmrc"

          if [ -f "$npmrc" ]; then
            echo "Before cleanup:"
            cat "$npmrc"

            sed -i '/_authToken/d' "$npmrc"

            echo "After cleanup:"
            cat "$npmrc"
          fi

      # ============================================================
      # 5. Verify Node / npm
      # ============================================================
      - name: Verify Node and npm
        run: |
          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          echo "npm registry:"
          npm config get registry

      # ============================================================
      # 6. Verify package version
      # ============================================================
      - name: Verify package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version:     $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version does not match Git tag."
            exit 1
          fi

      # ============================================================
      # 7. Verify package
      # ============================================================
      - name: Verify package
        run: |
          npm pkg get name version
          npm pack --dry-run

      # ============================================================
      # 8. Publish to npm using Trusted Publishing / OIDC
      # ============================================================
      - name: Publish to npm
        run: |
          npm publish --access public